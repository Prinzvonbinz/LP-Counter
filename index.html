<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LP Counter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    overflow:hidden;
}

/* START SCREEN */

#startScreen{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.startBox{
    width:100%;
    max-width:450px;
    background:#1b1b1b;
    padding:40px;
    border-radius:28px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.startBox h1{
    text-align:center;
    font-size:48px;
}

.input{
    width:100%;
    background:#2a2a2a;
    border:none;
    outline:none;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
}

.startBtn{
    background:#4f46e5;
    color:white;
    border:none;
    padding:18px;
    border-radius:18px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.startBtn:hover{
    transform:scale(1.03);
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    display:flex;
}

.player{
    width:50%;
    height:100%;
    padding:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:auto;
}

.player:nth-child(1){
    border-right:3px solid #202020;
}

.playerName{
    font-size:clamp(24px, 3vw, 38px);
    font-weight:bold;
    text-align:center;
}

.lp{
    font-size:clamp(70px, 10vw, 150px);
    font-weight:bold;
    margin-top:20px;
    text-align:center;
}

.plusMinus{
    display:flex;
    gap:14px;
    margin-top:25px;
}

.pmBtn{
    width:70px;
    height:70px;
    border:none;
    border-radius:20px;
    background:#262626;
    color:white;
    font-size:36px;
    cursor:pointer;
    transition:0.15s;
}

.pmBtn.selected{
    background:#4f46e5;
}

.pmBtn:hover{
    transform:scale(1.05);
}

.livePreview{
    margin-top:20px;
    font-size:28px;
    color:#a1a1aa;
    min-height:40px;
    text-align:center;
}

.lpInput{
    margin-top:18px;
    width:min(340px, 90%);
    background:#252525;
    border:none;
    outline:none;
    color:white;
    padding:18px;
    border-radius:20px;
    text-align:center;
    font-size:30px;
}

.quickButtons{
    margin-top:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.quickBtn{
    background:#232323;
    color:white;
    border:none;
    padding:14px 18px;
    border-radius:16px;
    font-size:22px;
    cursor:pointer;
    transition:0.15s;
}

.quickBtn:hover{
    transform:scale(1.05);
}

.okBtn{
    margin-top:28px;
    width:min(340px, 90%);
    background:#4f46e5;
    color:white;
    border:none;
    padding:18px;
    border-radius:20px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.okBtn:hover{
    transform:scale(1.05);
}

/* WIN SCREEN */

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}

#winnerText{
    font-size:clamp(40px, 7vw, 80px);
    font-weight:bold;
    text-align:center;
}

#countdown{
    margin-top:18px;
    color:#9ca3af;
    font-size:clamp(18px, 3vw, 30px);
}

.hidden{
    display:none !important;
}

/* PORTRAIT */

@media (orientation: portrait){

    body{
        overflow:auto;
    }

    #game{
        flex-direction:column;
        overflow:auto;
    }

    .player{
        width:100%;
        min-height:50vh;
    }

    .player:nth-child(1){
        border-right:none;
        border-bottom:3px solid #202020;
    }

    .lp{
        font-size:clamp(70px, 18vw, 140px);
    }

    .pmBtn{
        width:65px;
        height:65px;
    }

    .lpInput{
        width:95%;
        max-width:420px;
    }

    .okBtn{
        width:95%;
        max-width:420px;
        margin-bottom:20px;
    }
}

</style>
</head>

<body>

<!-- START -->

<div id="startScreen">

    <div class="startBox">

        <h1>LP Counter</h1>

        <input
            id="startLP"
            class="input"
            type="number"
            value="8000"
            placeholder="Start LP"
        >

        <input
            id="p1Name"
            class="input"
            type="text"
            value="Spieler 1"
            placeholder="Spieler 1"
        >

        <input
            id="p2Name"
            class="input"
            type="text"
            value="Spieler 2"
            placeholder="Spieler 2"
        >

        <button class="startBtn" onclick="startGame()">
            START
        </button>

    </div>

</div>

<!-- GAME -->

<div id="game" class="hidden">

    <!-- PLAYER 1 -->

    <div class="player">

        <div class="playerName" id="player1Name"></div>

        <div class="lp" id="lp1">8000</div>

        <div class="plusMinus">

            <button
                class="pmBtn"
                id="minus1"
                onclick="setMode(1,'minus')"
            >
                −
            </button>

            <button
                class="pmBtn"
                id="plus1"
                onclick="setMode(1,'plus')"
            >
                +
            </button>

        </div>

        <div class="livePreview" id="preview1"></div>

        <input
            id="input1"
            class="lpInput"
            type="number"
            placeholder="LP eingeben..."
            oninput="updatePreview(1)"
        >

        <div class="quickButtons">

            <button class="quickBtn" onclick="addQuick(1,1)">1</button>
            <button class="quickBtn" onclick="addQuick(1,5)">5</button>
            <button class="quickBtn" onclick="addQuick(1,10)">10</button>
            <button class="quickBtn" onclick="addQuick(1,20)">20</button>
            <button class="quickBtn" onclick="addQuick(1,50)">50</button>
            <button class="quickBtn" onclick="addQuick(1,100)">100</button>

        </div>

        <button class="okBtn" onclick="applyAction(1)">
            OK
        </button>

    </div>

    <!-- PLAYER 2 -->

    <div class="player">

        <div class="playerName" id="player2Name"></div>

        <div class="lp" id="lp2">8000</div>

        <div class="plusMinus">

            <button
                class="pmBtn"
                id="minus2"
                onclick="setMode(2,'minus')"
            >
                −
            </button>

            <button
                class="pmBtn"
                id="plus2"
                onclick="setMode(2,'plus')"
            >
                +
            </button>

        </div>

        <div class="livePreview" id="preview2"></div>

        <input
            id="input2"
            class="lpInput"
            type="number"
            placeholder="LP eingeben..."
            oninput="updatePreview(2)"
        >

        <div class="quickButtons">

            <button class="quickBtn" onclick="addQuick(2,1)">1</button>
            <button class="quickBtn" onclick="addQuick(2,5)">5</button>
            <button class="quickBtn" onclick="addQuick(2,10)">10</button>
            <button class="quickBtn" onclick="addQuick(2,20)">20</button>
            <button class="quickBtn" onclick="addQuick(2,50)">50</button>
            <button class="quickBtn" onclick="addQuick(2,100)">100</button>

        </div>

        <button class="okBtn" onclick="applyAction(2)">
            OK
        </button>

    </div>

</div>

<!-- WIN -->

<div id="winnerScreen" class="hidden">

    <div id="winnerText"></div>

    <div id="countdown"></div>

</div>

<script>

let players = {

    1:{
        lp:8000,
        mode:null
    },

    2:{
        lp:8000,
        mode:null
    }
};

/* START */

function startGame(){

    const startLP =
        parseInt(document.getElementById("startLP").value) || 8000;

    players[1].lp = startLP;
    players[2].lp = startLP;

    document.getElementById("lp1").innerText = startLP;
    document.getElementById("lp2").innerText = startLP;

    document.getElementById("player1Name").innerText =
        document.getElementById("p1Name").value || "Spieler 1";

    document.getElementById("player2Name").innerText =
        document.getElementById("p2Name").value || "Spieler 2";

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    resetPlayer(1);
    resetPlayer(2);
}

/* MODE */

function setMode(player, mode){

    players[player].mode = mode;

    document.getElementById("minus"+player)
        .classList.remove("selected");

    document.getElementById("plus"+player)
        .classList.remove("selected");

    if(mode === "minus"){

        document.getElementById("minus"+player)
            .classList.add("selected");

    }else{

        document.getElementById("plus"+player)
            .classList.add("selected");
    }

    updatePreview(player);
}

/* QUICK ADD */

function addQuick(player, value){

    const input =
        document.getElementById("input"+player);

    let current = parseInt(input.value) || 0;

    input.value = current + value;

    updatePreview(player);
}

/* PREVIEW */

function updatePreview(player){

    const preview =
        document.getElementById("preview"+player);

    const amount =
        parseInt(document.getElementById("input"+player).value) || 0;

    if(!players[player].mode || amount <= 0){

        preview.innerText = "";
        return;
    }

    if(players[player].mode === "minus"){

        preview.innerText =
            "− " + amount + " LP";

    }else{

        preview.innerText =
            "+ " + amount + " LP";
    }
}

/* APPLY */

function applyAction(player){

    const amount =
        parseInt(document.getElementById("input"+player).value);

    if(!amount || amount <= 0){
        return;
    }

    if(!players[player].mode){
        return;
    }

    if(players[player].mode === "minus"){

        players[player].lp -= amount;

    }else{

        players[player].lp += amount;
    }

    if(players[player].lp < 0){
        players[player].lp = 0;
    }

    document.getElementById("lp"+player).innerText =
        players[player].lp;

    if(players[player].lp <= 0){

        showWinner(player === 1 ? 2 : 1);
    }

    resetPlayer(player);
}

/* RESET */

function resetPlayer(player){

    document.getElementById("input"+player).value = "";

    document.getElementById("preview"+player).innerText = "";

    players[player].mode = null;

    document.getElementById("minus"+player)
        .classList.remove("selected");

    document.getElementById("plus"+player)
        .classList.remove("selected");
}

/* WIN */

function showWinner(player){

    const winnerScreen =
        document.getElementById("winnerScreen");

    winnerScreen.classList.remove("hidden");

    document.getElementById("winnerText").innerText =
        "Spieler " + player + " gewinnt!";

    let time = 5;

    document.getElementById("countdown").innerText =
        "Zurück in " + time + "...";

    const interval = setInterval(()=>{

        time--;

        document.getElementById("countdown").innerText =
            "Zurück in " + time + "...";

        if(time <= 0){

            clearInterval(interval);

            winnerScreen.classList.add("hidden");

            document.getElementById("game")
                .classList.add("hidden");

            document.getElementById("startScreen")
                .classList.remove("hidden");
        }

    },1000);
}

</script>

</body>
</html>
