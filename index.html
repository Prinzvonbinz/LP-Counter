<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LP Counter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    overflow:hidden;
}

/* START SCREEN */

#startScreen{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.startBox{
    background:#1c1c1c;
    padding:40px;
    border-radius:28px;
    width:100%;
    max-width:450px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.startBox h1{
    text-align:center;
    font-size:48px;
}

.input{
    background:#2b2b2b;
    border:none;
    outline:none;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
}

.startBtn{
    background:#4f46e5;
    color:white;
    border:none;
    padding:18px;
    border-radius:18px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.startBtn:hover{
    transform:scale(1.03);
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    display:flex;
}

/* PLAYER */

.player{
    width:50%;
    height:100%;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    overflow:auto;
}

.player:nth-child(1){
    border-right:3px solid #222;
}

.playerName{
    font-size:clamp(24px, 3vw, 38px);
    font-weight:bold;
    margin-top:5px;
    text-align:center;
}

.lp{
    font-size:clamp(70px, 10vw, 140px);
    font-weight:bold;
    margin-top:25px;
    text-align:center;
}

.plusMinus{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.pmBtn{
    width:clamp(48px, 7vw, 65px);
    height:clamp(48px, 7vw, 65px);
    border:none;
    border-radius:18px;
    background:#2b2b2b;
    color:white;
    font-size:clamp(24px, 4vw, 36px);
    cursor:pointer;
    transition:0.15s;
}

.pmBtn:hover{
    transform:scale(1.06);
}

.preview{
    margin-top:18px;
    min-height:40px;
    font-size:clamp(18px, 3vw, 30px);
    font-weight:bold;
    color:#9e9e9e;
    text-align:center;
}

/* NUMBER BUTTONS */

.numberGrid{
    margin-top:28px;
    width:min(330px, 95%);
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
}

.numberBtn{
    background:#232323;
    color:white;
    border:none;
    padding:18px;
    border-radius:18px;
    font-size:clamp(18px, 3vw, 28px);
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.numberBtn:hover{
    transform:scale(1.05);
}

.numberBtn.selected{
    background:#4f46e5;
}

/* OPERATIONS */

.operationRow{
    margin-top:22px;
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
}

.operationBtn{
    width:100px;
    height:58px;
    border:none;
    border-radius:18px;
    background:#2b2b2b;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.operationBtn.selected{
    background:#16a34a;
}

.operationBtn:disabled{
    opacity:0.35;
    cursor:not-allowed;
}

.okBtn{
    margin-top:26px;
    background:#4f46e5;
    color:white;
    border:none;
    padding:18px 40px;
    border-radius:18px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:0.15s;
}

.okBtn:hover{
    transform:scale(1.05);
}

/* WIN SCREEN */

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}

#winnerText{
    font-size:clamp(42px, 7vw, 80px);
    font-weight:bold;
    text-align:center;
}

#countdown{
    margin-top:20px;
    font-size:clamp(20px, 3vw, 32px);
    color:#9e9e9e;
}

.hidden{
    display:none !important;
}

/* PORTRAIT MODE */

@media (orientation: portrait){

    body{
        overflow:auto;
    }

    #game{
        flex-direction:column;
        overflow:auto;
    }

    .player{
        width:100%;
        min-height:50vh;
    }

    .player:nth-child(1){
        border-right:none;
        border-bottom:3px solid #222;
    }

    .lp{
        font-size:clamp(60px, 16vw, 120px);
    }

    .numberGrid{
        width:95%;
        max-width:450px;
    }

    .numberBtn{
        padding:20px;
        font-size:28px;
    }

    .okBtn{
        width:95%;
        max-width:450px;
        margin-bottom:25px;
    }

    .operationRow{
        width:100%;
    }

    .operationBtn{
        flex:1;
        max-width:200px;
    }
}

</style>
</head>

<body>

<!-- START -->

<div id="startScreen">

    <div class="startBox">

        <h1>LP Counter</h1>

        <input
            id="startLP"
            class="input"
            type="number"
            value="8000"
            placeholder="Start LP"
        >

        <input
            id="p1Name"
            class="input"
            type="text"
            value="Spieler 1"
            placeholder="Spieler 1"
        >

        <input
            id="p2Name"
            class="input"
            type="text"
            value="Spieler 2"
            placeholder="Spieler 2"
        >

        <button class="startBtn" onclick="startGame()">
            START
        </button>

    </div>

</div>

<!-- GAME -->

<div id="game" class="hidden">

    <!-- PLAYER 1 -->

    <div class="player">

        <div class="playerName" id="player1Name"></div>

        <div class="lp" id="lp1">8000</div>

        <div class="plusMinus">
            <button class="pmBtn" onclick="setMode(1,'minus')">−</button>
            <button class="pmBtn" onclick="setMode(1,'plus')">+</button>
        </div>

        <div class="preview" id="preview1"></div>

        <div class="numberGrid" id="numbers1"></div>

        <div class="operationRow">
            <button class="operationBtn" id="x2_1" onclick="setOperation(1,'x2')">
                ×2
            </button>

            <button class="operationBtn" id="d2_1" onclick="setOperation(1,'d2')">
                ÷2
            </button>
        </div>

        <button class="okBtn" onclick="applyAction(1)">
            OK
        </button>

    </div>

    <!-- PLAYER 2 -->

    <div class="player">

        <div class="playerName" id="player2Name"></div>

        <div class="lp" id="lp2">8000</div>

        <div class="plusMinus">
            <button class="pmBtn" onclick="setMode(2,'minus')">−</button>
            <button class="pmBtn" onclick="setMode(2,'plus')">+</button>
        </div>

        <div class="preview" id="preview2"></div>

        <div class="numberGrid" id="numbers2"></div>

        <div class="operationRow">
            <button class="operationBtn" id="x2_2" onclick="setOperation(2,'x2')">
                ×2
            </button>

            <button class="operationBtn" id="d2_2" onclick="setOperation(2,'d2')">
                ÷2
            </button>
        </div>

        <button class="okBtn" onclick="applyAction(2)">
            OK
        </button>

    </div>

</div>

<!-- WIN SCREEN -->

<div id="winnerScreen" class="hidden">

    <div id="winnerText"></div>

    <div id="countdown"></div>

</div>

<script>

const values = [1,5,10,20,50,100];

let players = {
    1:{
        lp:8000,
        mode:null,
        selected:null,
        operation:null
    },

    2:{
        lp:8000,
        mode:null,
        selected:null,
        operation:null
    }
};

/* START GAME */

function startGame(){

    const lp =
        parseInt(document.getElementById("startLP").value) || 8000;

    players[1].lp = lp;
    players[2].lp = lp;

    document.getElementById("lp1").innerText = lp;
    document.getElementById("lp2").innerText = lp;

    document.getElementById("player1Name").innerText =
        document.getElementById("p1Name").value || "Spieler 1";

    document.getElementById("player2Name").innerText =
        document.getElementById("p2Name").value || "Spieler 2";

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    createButtons(1);
    createButtons(2);

    resetPlayer(1);
    resetPlayer(2);
}

/* CREATE NUMBER BUTTONS */

function createButtons(player){

    const container =
        document.getElementById("numbers"+player);

    container.innerHTML = "";

    values.forEach(value=>{

        const btn = document.createElement("button");

        btn.className = "numberBtn";
        btn.innerText = value;

        btn.onclick = ()=>{
            selectNumber(player,value,btn);
        };

        container.appendChild(btn);
    });
}

/* PLUS / MINUS */

function setMode(player, mode){

    players[player].mode = mode;

    updatePreview(player);
}

/* NUMBER SELECT */

function selectNumber(player, value, btn){

    players[player].selected = value;

    const buttons =
        document.querySelectorAll("#numbers"+player+" .numberBtn");

    buttons.forEach(b=>{
        b.classList.remove("selected");
    });

    btn.classList.add("selected");

    document.getElementById("x2_"+player).disabled = true;
    document.getElementById("d2_"+player).disabled = true;

    updatePreview(player);
}

/* OPERATION */

function setOperation(player, operation){

    if(players[player].selected !== null){
        return;
    }

    players[player].operation = operation;

    document.getElementById("x2_"+player)
        .classList.remove("selected");

    document.getElementById("d2_"+player)
        .classList.remove("selected");

    if(operation === "x2"){

        document.getElementById("x2_"+player)
            .classList.add("selected");

    }else{

        document.getElementById("d2_"+player)
            .classList.add("selected");
    }

    updatePreview(player);
}

/* GET AMOUNT */

function getAmount(player){

    let amount = players[player].selected || 0;

    if(players[player].operation === "x2"){
        amount *= 2;
    }

    if(players[player].operation === "d2"){
        amount /= 2;
    }

    return amount;
}

/* PREVIEW */

function updatePreview(player){

    const preview =
        document.getElementById("preview"+player);

    if(!players[player].mode){

        preview.innerText = "";
        return;
    }

    const amount = getAmount(player);

    if(amount === 0){

        preview.innerText = "";
        return;
    }

    if(players[player].mode === "minus"){

        preview.innerText =
            "− " + amount + " LP";

    }else{

        preview.innerText =
            "+ " + amount + " LP";
    }
}

/* APPLY */

function applyAction(player){

    if(players[player].selected === null) return;
    if(!players[player].mode) return;

    const amount = getAmount(player);

    if(players[player].mode === "minus"){

        players[player].lp -= amount;

    }else{

        players[player].lp += amount;
    }

    if(players[player].lp < 0){
        players[player].lp = 0;
    }

    document.getElementById("lp"+player)
        .innerText = Math.floor(players[player].lp);

    if(players[player].lp <= 0){

        showWinner(player === 1 ? 2 : 1);
    }

    resetPlayer(player);
}

/* RESET */

function resetPlayer(player){

    players[player].selected = null;
    players[player].operation = null;
    players[player].mode = null;

    document.getElementById("preview"+player)
        .innerText = "";

    const buttons =
        document.querySelectorAll("#numbers"+player+" .numberBtn");

    buttons.forEach(b=>{
        b.classList.remove("selected");
    });

    document.getElementById("x2_"+player).disabled = false;
    document.getElementById("d2_"+player).disabled = false;

    document.getElementById("x2_"+player)
        .classList.remove("selected");

    document.getElementById("d2_"+player)
        .classList.remove("selected");
}

/* WIN SCREEN */

function showWinner(player){

    const winnerScreen =
        document.getElementById("winnerScreen");

    winnerScreen.classList.remove("hidden");

    document.getElementById("winnerText").innerText =
        "Spieler " + player + " gewinnt!";

    let time = 5;

    document.getElementById("countdown").innerText =
        "Zurück in " + time + "...";

    const interval = setInterval(()=>{

        time--;

        document.getElementById("countdown").innerText =
            "Zurück in " + time + "...";

        if(time <= 0){

            clearInterval(interval);

            winnerScreen.classList.add("hidden");

            document.getElementById("game")
                .classList.add("hidden");

            document.getElementById("startScreen")
                .classList.remove("hidden");
        }

    },1000);
}

</script>

</body>
</html>
