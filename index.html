<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>LP Counter</title>

<style>

:root{
    --bg:#07070b;
    --card:#111118;
    --card2:#181822;
    --border:#2a2a38;
    --text:#ffffff;
    --muted:#9ca3af;
    --accent:#6366f1;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at top left,#1a1a2e 0%,#07070b 55%);
    color:var(--text);
}

/* GLOBAL */

.hidden{
    display:none !important;
}

button,
input{
    -webkit-tap-highlight-color:transparent;
}

/* START */

#startScreen{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.startCard{
    width:min(500px,100%);
    background:rgba(17,17,24,0.97);
    border:1px solid var(--border);
    border-radius:32px;
    padding:32px;
    backdrop-filter:blur(14px);
    box-shadow:
        0 0 50px rgba(0,0,0,0.45),
        0 0 120px rgba(99,102,241,0.08);
}

.logo{
    text-align:center;
    font-size:clamp(42px,7vw,64px);
    font-weight:900;
    margin-bottom:28px;
    letter-spacing:-3px;
}

.startInputs{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.startInput{
    width:100%;
    background:var(--card2);
    border:2px solid transparent;
    outline:none;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
    transition:0.18s;
}

.startInput:focus{
    border-color:var(--accent);
}

.startBtn{
    margin-top:6px;
    width:100%;
    border:none;
    background:var(--accent);
    color:white;
    padding:18px;
    border-radius:20px;
    font-size:24px;
    font-weight:800;
    cursor:pointer;
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    display:flex;
}

/* PLAYER */

.player{
    flex:1;
    padding:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-width:0;
}

.player:first-child{
    border-right:1px solid var(--border);
}

.playerCard{
    width:100%;
    height:100%;
    background:rgba(17,17,24,0.96);
    border:1px solid var(--border);
    border-radius:32px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    gap:14px;
    backdrop-filter:blur(12px);
    overflow:hidden;
    box-shadow:
        0 0 30px rgba(0,0,0,0.35),
        0 0 100px rgba(99,102,241,0.04);
}

.playerName{
    font-size:clamp(20px,2.8vw,40px);
    font-weight:800;
    text-align:center;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
}

.lp{
    font-size:clamp(52px,10vw,160px);
    font-weight:900;
    line-height:1;
    letter-spacing:-4px;
    text-align:center;
}

/* + / - */

.modeButtons{
    display:flex;
    gap:14px;
}

.modeBtn{
    width:clamp(60px,7vw,88px);
    height:clamp(60px,7vw,88px);
    border:none;
    border-radius:22px;
    background:var(--card2);
    color:white;
    font-size:clamp(30px,4vw,46px);
    font-weight:700;
    cursor:pointer;
    transition:0.15s;
}

.modeBtn:active{
    transform:scale(0.96);
}

.modeBtn.minusActive{
    background:var(--red);
}

.modeBtn.plusActive{
    background:var(--green);
}

/* INPUT */

.amountInput{
    width:min(360px,95%);
    background:#0d0d13;
    border:2px solid var(--border);
    outline:none;
    color:white;
    padding:18px;
    border-radius:24px;
    text-align:center;
    font-size:clamp(26px,4vw,44px);
    font-weight:800;
    transition:0.18s;
}

.amountInput:focus{
    border-color:var(--accent);
}

/* PREVIEW */

.preview{
    min-height:34px;
    font-size:clamp(18px,2vw,30px);
    color:var(--muted);
    font-weight:700;
    text-align:center;
}

/* OK BUTTON */

.okBtn{
    width:min(360px,95%);
    border:none;
    background:var(--accent);
    color:white;
    padding:18px;
    border-radius:24px;
    font-size:clamp(22px,3vw,32px);
    font-weight:900;
    cursor:pointer;
    transition:0.15s;
}

.okBtn:active{
    transform:scale(0.98);
}

/* WIN */

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(4,4,8,0.94);
    backdrop-filter:blur(14px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:20px;
}

#winnerText{
    font-size:clamp(42px,8vw,100px);
    font-weight:900;
    text-align:center;
    letter-spacing:-3px;
}

#winnerSub{
    margin-top:18px;
    color:var(--muted);
    font-size:clamp(18px,3vw,32px);
}

/* PORTRAIT */

@media (orientation:portrait){

    html,body{
        overflow:auto;
    }

    #game{
        flex-direction:column;
        height:auto;
        min-height:100vh;
    }

    .player{
        width:100%;
        min-height:50vh;
        padding:12px;
    }

    .player:first-child{
        border-right:none;
    }

    .playerCard{
        min-height:calc(50vh - 24px);
        gap:12px;
        padding:16px;
    }

    .lp{
        font-size:clamp(56px,17vw,130px);
    }

    .amountInput{
        width:100%;
        font-size:34px;
        padding:16px;
    }

    .okBtn{
        width:100%;
    }

    .modeBtn{
        width:68px;
        height:68px;
        font-size:36px;
    }
}

</style>
</head>
<body>

<!-- START -->

<div id="startScreen">

    <div class="startCard">

        <div class="logo">
            LP Counter
        </div>

        <div class="startInputs">

            <input
                id="startLP"
                class="startInput"
                type="number"
                value="8000"
                placeholder="Start LP"
            >

            <input
                id="p1Name"
                class="startInput"
                type="text"
                value="Spieler 1"
                placeholder="Spieler 1"
            >

            <input
                id="p2Name"
                class="startInput"
                type="text"
                value="Spieler 2"
                placeholder="Spieler 2"
            >

            <button
                class="startBtn"
                onclick="startGame()"
            >
                START
            </button>

        </div>

    </div>

</div>

<!-- GAME -->

<div id="game" class="hidden">

    <!-- PLAYER 1 -->

    <div class="player">

        <div class="playerCard">

            <div class="playerName" id="name1">
                Spieler 1
            </div>

            <div class="lp" id="lp1">
                8000
            </div>

            <div class="modeButtons">

                <button
                    class="modeBtn"
                    id="minus1"
                    onclick="setMode(1,'minus')"
                >
                    −
                </button>

                <button
                    class="modeBtn"
                    id="plus1"
                    onclick="setMode(1,'plus')"
                >
                    +
                </button>

            </div>

            <input
                id="input1"
                class="amountInput"
                type="number"
                placeholder="LP eingeben"
                oninput="updatePreview(1)"
            >

            <div
                class="preview"
                id="preview1"
            ></div>

            <button
                class="okBtn"
                onclick="applyLP(1)"
            >
                OK
            </button>

        </div>

    </div>

    <!-- PLAYER 2 -->

    <div class="player">

        <div class="playerCard">

            <div class="playerName" id="name2">
                Spieler 2
            </div>

            <div class="lp" id="lp2">
                8000
            </div>

            <div class="modeButtons">

                <button
                    class="modeBtn"
                    id="minus2"
                    onclick="setMode(2,'minus')"
                >
                    −
                </button>

                <button
                    class="modeBtn"
                    id="plus2"
                    onclick="setMode(2,'plus')"
                >
                    +
                </button>

            </div>

            <input
                id="input2"
                class="amountInput"
                type="number"
                placeholder="LP eingeben"
                oninput="updatePreview(2)"
            >

            <div
                class="preview"
                id="preview2"
            ></div>

            <button
                class="okBtn"
                onclick="applyLP(2)"
            >
                OK
            </button>

        </div>

    </div>

</div>

<!-- WIN -->

<div id="winnerScreen" class="hidden">

    <div id="winnerText"></div>

    <div id="winnerSub"></div>

</div>

<script>

let players = {

    1:{
        lp:8000,
        mode:null
    },

    2:{
        lp:8000,
        mode:null
    }
};

/* START */

function startGame(){

    const startLP =
        parseInt(
            document.getElementById("startLP").value
        ) || 8000;

    players[1].lp = startLP;
    players[2].lp = startLP;

    document.getElementById("lp1").innerText = startLP;
    document.getElementById("lp2").innerText = startLP;

    document.getElementById("name1").innerText =
        document.getElementById("p1Name").value || "Spieler 1";

    document.getElementById("name2").innerText =
        document.getElementById("p2Name").value || "Spieler 2";

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.remove("hidden");

    resetPlayer(1);
    resetPlayer(2);
}

/* MODE */

function setMode(player,mode){

    players[player].mode = mode;

    const minus =
        document.getElementById("minus"+player);

    const plus =
        document.getElementById("plus"+player);

    minus.classList.remove("minusActive");
    plus.classList.remove("plusActive");

    if(mode === "minus"){

        minus.classList.add("minusActive");

    }else{

        plus.classList.add("plusActive");
    }

    updatePreview(player);
}

/* PREVIEW */

function updatePreview(player){

    const value =
        parseInt(
            document.getElementById("input"+player).value
        ) || 0;

    const preview =
        document.getElementById("preview"+player);

    if(!players[player].mode || value <= 0){

        preview.innerText = "";
        return;
    }

    if(players[player].mode === "minus"){

        preview.innerText =
            "− " + value + " LP";

    }else{

        preview.innerText =
            "+ " + value + " LP";
    }
}

/* APPLY */

function applyLP(player){

    const value =
        parseInt(
            document.getElementById("input"+player).value
        );

    if(!players[player].mode) return;
    if(!value || value <= 0) return;

    if(players[player].mode === "minus"){

        players[player].lp -= value;

    }else{

        players[player].lp += value;
    }

    if(players[player].lp < 0){

        players[player].lp = 0;
    }

    document.getElementById("lp"+player)
        .innerText = players[player].lp;

    if(players[player].lp <= 0){

        showWinner(
            player === 1 ? 2 : 1
        );
    }

    resetPlayer(player);
}

/* RESET */

function resetPlayer(player){

    players[player].mode = null;

    document.getElementById("input"+player).value = "";

    document.getElementById("preview"+player)
        .innerText = "";

    document.getElementById("minus"+player)
        .classList.remove("minusActive");

    document.getElementById("plus"+player)
        .classList.remove("plusActive");
}

/* WIN */

function showWinner(winner){

    document.getElementById("winnerScreen")
        .classList.remove("hidden");

    document.getElementById("winnerText").innerText =
        "Spieler " + winner + " gewinnt";

    let time = 5;

    document.getElementById("winnerSub").innerText =
        "Zurück in " + time + "...";

    const interval = setInterval(()=>{

        time--;

        document.getElementById("winnerSub").innerText =
            "Zurück in " + time + "...";

        if(time <= 0){

            clearInterval(interval);

            document.getElementById("winnerScreen")
                .classList.add("hidden");

            document.getElementById("game")
                .classList.add("hidden");

            document.getElementById("startScreen")
                .classList.remove("hidden");
        }

    },1000);
}

</script>

</body>
</html>
