<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LP Counter Pro</title>

<style>

:root{
    --bg:#0a0a0f;
    --card:#16161f;
    --card2:#1d1d29;
    --border:#2a2a3a;
    --text:#ffffff;
    --muted:#8b8ba7;
    --accent:#6366f1;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, sans-serif;
}

body{
    background:linear-gradient(to bottom right,#09090f,#12121c);
    color:var(--text);
    overflow:hidden;
}

/* START */

#startScreen{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.startCard{
    width:100%;
    max-width:480px;
    background:rgba(22,22,31,0.96);
    border:1px solid var(--border);
    border-radius:32px;
    padding:42px;
    backdrop-filter:blur(14px);
    box-shadow:
        0 0 40px rgba(0,0,0,0.45),
        0 0 100px rgba(99,102,241,0.08);
}

.logo{
    text-align:center;
    font-size:56px;
    font-weight:900;
    margin-bottom:36px;
    letter-spacing:-2px;
}

.startInputs{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.startInput{
    width:100%;
    border:none;
    outline:none;
    background:var(--card2);
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:18px;
    border:1px solid transparent;
    transition:0.2s;
}

.startInput:focus{
    border-color:var(--accent);
}

.startBtn{
    margin-top:10px;
    width:100%;
    border:none;
    background:var(--accent);
    color:white;
    padding:18px;
    border-radius:20px;
    font-size:24px;
    font-weight:800;
    cursor:pointer;
    transition:0.2s;
}

.startBtn:hover{
    transform:translateY(-2px);
}

/* GAME */

#game{
    width:100vw;
    height:100vh;
    display:flex;
}

.player{
    width:50%;
    height:100%;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.player:first-child{
    border-right:1px solid var(--border);
}

.playerCard{
    width:100%;
    height:100%;
    background:rgba(22,22,31,0.96);
    border:1px solid var(--border);
    border-radius:36px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:35px;
    backdrop-filter:blur(10px);
    box-shadow:
        0 0 30px rgba(0,0,0,0.35),
        0 0 70px rgba(99,102,241,0.05);
}

.playerName{
    font-size:clamp(24px,3vw,42px);
    font-weight:800;
    text-align:center;
}

.lp{
    margin-top:15px;
    font-size:clamp(70px,10vw,170px);
    font-weight:900;
    letter-spacing:-4px;
    text-align:center;
}

.modeButtons{
    display:flex;
    gap:16px;
    margin-top:24px;
}

.modeBtn{
    width:85px;
    height:85px;
    border:none;
    border-radius:24px;
    background:var(--card2);
    color:white;
    font-size:42px;
    font-weight:700;
    cursor:pointer;
    transition:0.18s;
}

.modeBtn:hover{
    transform:scale(1.05);
}

.modeBtn.activePlus{
    background:var(--green);
}

.modeBtn.activeMinus{
    background:var(--red);
}

.amountInput{
    margin-top:28px;
    width:min(360px,90%);
    border:none;
    outline:none;
    background:#111118;
    border:2px solid var(--border);
    color:white;
    text-align:center;
    font-size:42px;
    font-weight:800;
    padding:22px;
    border-radius:24px;
    transition:0.2s;
}

.amountInput:focus{
    border-color:var(--accent);
}

.preview{
    margin-top:18px;
    min-height:40px;
    font-size:30px;
    font-weight:700;
    color:var(--muted);
    text-align:center;
}

.okBtn{
    margin-top:28px;
    width:min(360px,90%);
    border:none;
    background:var(--accent);
    color:white;
    padding:20px;
    border-radius:24px;
    font-size:28px;
    font-weight:900;
    cursor:pointer;
    transition:0.18s;
}

.okBtn:hover{
    transform:translateY(-2px);
}

/* WIN SCREEN */

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(5,5,10,0.94);
    backdrop-filter:blur(16px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
}

#winnerText{
    font-size:clamp(42px,7vw,90px);
    font-weight:900;
    text-align:center;
    letter-spacing:-3px;
}

#winnerSub{
    margin-top:18px;
    font-size:clamp(18px,2vw,30px);
    color:var(--muted);
}

.hidden{
    display:none !important;
}

/* PORTRAIT */

@media (orientation: portrait){

    body{
        overflow:auto;
    }

    #game{
        flex-direction:column;
        overflow:auto;
    }

    .player{
        width:100%;
        min-height:50vh;
        padding:18px;
    }

    .player:first-child{
        border-right:none;
    }

    .playerCard{
        border-radius:28px;
    }

    .lp{
        font-size:clamp(64px,18vw,140px);
    }

    .modeBtn{
        width:72px;
        height:72px;
        font-size:34px;
    }

    .amountInput{
        width:95%;
        font-size:36px;
    }

    .okBtn{
        width:95%;
    }
}

</style>
</head>
<body>

<!-- START -->

<div id="startScreen">

    <div class="startCard">

        <div class="logo">LP Counter</div>

        <div class="startInputs">

            <input
                id="startLP"
                class="startInput"
                type="number"
                value="8000"
                placeholder="Start LP"
            >

            <input
                id="p1Name"
                class="startInput"
                type="text"
                value="Spieler 1"
                placeholder="Spieler 1"
            >

            <input
                id="p2Name"
                class="startInput"
                type="text"
                value="Spieler 2"
                placeholder="Spieler 2"
            >

            <button class="startBtn" onclick="startGame()">
                START
            </button>

        </div>

    </div>

</div>

<!-- GAME -->

<div id="game" class="hidden">

    <!-- PLAYER 1 -->

    <div class="player">

        <div class="playerCard">

            <div class="playerName" id="name1">
                Spieler 1
            </div>

            <div class="lp" id="lp1">
                8000
            </div>

            <div class="modeButtons">

                <button
                    id="minus1"
                    class="modeBtn"
                    onclick="setMode(1,'minus')"
                >
                    −
                </button>

                <button
                    id="plus1"
                    class="modeBtn"
                    onclick="setMode(1,'plus')"
                >
                    +
                </button>

            </div>

            <input
                id="input1"
                class="amountInput"
                type="number"
                placeholder="LP"
                oninput="updatePreview(1)"
            >

            <div class="preview" id="preview1"></div>

            <button
                class="okBtn"
                onclick="applyLP(1)"
            >
                OK
            </button>

        </div>

    </div>

    <!-- PLAYER 2 -->

    <div class="player">

        <div class="playerCard">

            <div class="playerName" id="name2">
                Spieler 2
            </div>

            <div class="lp" id="lp2">
                8000
            </div>

            <div class="modeButtons">

                <button
                    id="minus2"
                    class="modeBtn"
                    onclick="setMode(2,'minus')"
                >
                    −
                </button>

                <button
                    id="plus2"
                    class="modeBtn"
                    onclick="setMode(2,'plus')"
                >
                    +
                </button>

            </div>

            <input
                id="input2"
                class="amountInput"
                type="number"
                placeholder="LP"
                oninput="updatePreview(2)"
            >

            <div class="preview" id="preview2"></div>

            <button
                class="okBtn"
                onclick="applyLP(2)"
            >
                OK
            </button>

        </div>

    </div>

</div>

<!-- WIN -->

<div id="winnerScreen" class="hidden">

    <div id="winnerText"></div>

    <div id="winnerSub"></div>

</div>

<script>

let players = {

    1:{
        lp:8000,
        mode:null
    },

    2:{
        lp:8000,
        mode:null
    }
};

/* START */

function startGame(){

    const startLP =
        parseInt(
            document.getElementById("startLP").value
        ) || 8000;

    players[1].lp = startLP;
    players[2].lp = startLP;

    document.getElementById("lp1").innerText = startLP;
    document.getElementById("lp2").innerText = startLP;

    document.getElementById("name1").innerText =
        document.getElementById("p1Name").value || "Spieler 1";

    document.getElementById("name2").innerText =
        document.getElementById("p2Name").value || "Spieler 2";

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.remove("hidden");

    resetPlayer(1);
    resetPlayer(2);
}

/* MODE */

function setMode(player, mode){

    players[player].mode = mode;

    const minus =
        document.getElementById("minus"+player);

    const plus =
        document.getElementById("plus"+player);

    minus.classList.remove("activeMinus");
    plus.classList.remove("activePlus");

    if(mode === "minus"){

        minus.classList.add("activeMinus");

    }else{

        plus.classList.add("activePlus");
    }

    updatePreview(player);
}

/* PREVIEW */

function updatePreview(player){

    const value =
        parseInt(
            document.getElementById("input"+player).value
        ) || 0;

    const preview =
        document.getElementById("preview"+player);

    if(!players[player].mode || value <= 0){

        preview.innerText = "";
        return;
    }

    if(players[player].mode === "minus"){

        preview.innerText =
            "− " + value + " LP";

    }else{

        preview.innerText =
            "+ " + value + " LP";
    }
}

/* APPLY */

function applyLP(player){

    const value =
        parseInt(
            document.getElementById("input"+player).value
        );

    if(!players[player].mode){
        return;
    }

    if(!value || value <= 0){
        return;
    }

    if(players[player].mode === "minus"){

        players[player].lp -= value;

    }else{

        players[player].lp += value;
    }

    if(players[player].lp < 0){
        players[player].lp = 0;
    }

    document.getElementById("lp"+player).innerText =
        players[player].lp;

    if(players[player].lp <= 0){

        showWinner(
            player === 1 ? 2 : 1
        );
    }

    resetPlayer(player);
}

/* RESET */

function resetPlayer(player){

    players[player].mode = null;

    document.getElementById("input"+player).value = "";

    document.getElementById("preview"+player).innerText = "";

    document.getElementById("minus"+player)
        .classList.remove("activeMinus");

    document.getElementById("plus"+player)
        .classList.remove("activePlus");
}

/* WIN */

function showWinner(winner){

    document.getElementById("winnerScreen")
        .classList.remove("hidden");

    document.getElementById("winnerText").innerText =
        "Spieler " + winner + " gewinnt";

    let time = 5;

    document.getElementById("winnerSub").innerText =
        "Zurück in " + time + "...";

    const interval = setInterval(()=>{

        time--;

        document.getElementById("winnerSub").innerText =
            "Zurück in " + time + "...";

        if(time <= 0){

            clearInterval(interval);

            document.getElementById("winnerScreen")
                .classList.add("hidden");

            document.getElementById("game")
                .classList.add("hidden");

            document.getElementById("startScreen")
                .classList.remove("hidden");
        }

    },1000);
}

</script>

</body>
</html>
